# 集成测试用：内存 H2，MySQL 兼容模式，跑同一份 Flyway 脚本
spring:
  datasource:
    url: jdbc:h2:mem:mmb-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # 测试上传的图片丢在 target 里，别污染项目
  upload-dir: ./target/test-uploads
