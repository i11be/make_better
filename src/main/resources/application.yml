spring:
  application:
    name: make-me-better
  profiles:
    default: mysql
  # 本地数据库账号密码放 application-local.yml（不进版本库），有这个文件就自动读
  config:
    import: optional:file:./application-local.yml
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  thymeleaf:
    cache: false
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

server:
  port: 8090
  # 学习笔记正文放宽到 16MB，和 entries.body_md 的 MEDIUMTEXT 对上
  tomcat:
    max-http-form-post-size: 16MB
  error:
    include-message: always
    whitelabel:
      enabled: false

app:
  diary-unlock-minutes: 30
  # 头像和动态图片放这里（数据库只存相对路径）
  upload-dir: ./data/uploads
