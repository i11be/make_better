<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" data-theme="auto">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="wrap">
  <article class="post post-detail">
    <a class="back-link" th:href="@{/feed}">← 动态</a>
    <header class="post-head">
      <img class="post-avatar" th:if="${profile != null and !#strings.isEmpty(profile.avatarPath)}"
           th:src="${profile.avatarUrl}" alt="" />
      <span class="post-avatar post-initial" th:if="${profile == null or #strings.isEmpty(profile.avatarPath)}"
            th:text="${initial}">M</span>
      <div class="post-who">
        <a class="post-name" th:href="@{/}" th:text="${profile != null ? profile.username : '我'}">我</a>
        <time class="quiet" th:text="${@viewHelper.dateTime(entry.createdAt)}">时间</time>
      </div>
    </header>

    <p class="post-body" th:if="${!#strings.isEmpty(entry.bodyMd)}" th:text="${entry.bodyMd}">正文</p>

    <div class="post-grid" th:if="${not #lists.isEmpty(images)}"
         th:classappend="${#lists.size(images) == 1} ? 'single'">
      <a class="post-img" th:each="img : ${images}" href="#" data-lightbox
         th:attr="data-full=${img.url}">
        <img th:src="${img.thumbUrl}" alt="" loading="lazy" />
      </a>
    </div>

    <footer class="post-foot">
      <form th:if="${user != null}" th:action="${'/feed/' + entry.id + '/delete'}" method="post"
            class="inline" data-confirm="删掉这条动态？配图也会一起删。">
        <button type="submit" class="linklike danger">删掉这条</button>
      </form>
    </footer>
  </article>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
