<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" data-theme="auto">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="wrap wrap-wide">
  <header class="page-head">
    <div>
      <a class="back-link" th:href="@{/archive}">← 档案</a>
      <h1 class="page-title" th:text="${archive.title}">档案标题</h1>
    </div>
    <div class="head-actions">
      <a class="quiet" th:if="${user != null}" th:href="${'/admin/archives/' + archive.id}">管理档案 →</a>
    </div>
  </header>

  <p class="empty" th:if="${#lists.isEmpty(items)}">
    这个档案还没有条目。点右上角「管理档案」开始写。
  </p>

  <div class="archive-body" th:unless="${#lists.isEmpty(items)}">
    <aside class="archive-toc">
      <p class="toc-title">目录</p>
      <ol>
        <li th:each="i : ${items}">
          <a th:href="${'/archive/' + archive.id + '?item=' + i.id}"
             th:classappend="${current != null and current.id == i.id} ? 'on'"
             th:text="${i.title}">条目</a>
        </li>
      </ol>
    </aside>

    <article class="archive-content" th:if="${current != null}">
      <h2 class="entry-title" th:text="${current.title}">条目标题</h2>
      <p class="meta-line">
        <span class="quiet" th:text="${'写于 ' + @viewHelper.dateTime(current.updatedAt)}">时间</span>
        <a class="quiet" th:if="${user != null}"
           th:href="${'/admin/archives/' + archive.id + '/items/' + current.id}">改这一条 →</a>
      </p>

      <div class="prose" th:utext="${html}"></div>

      <nav class="archive-pager" th:if="${prev != null or next != null}">
        <a class="pager-link" th:if="${prev != null}"
           th:href="${'/archive/' + archive.id + '?item=' + prev.id}">
          <span class="pager-dir">← 上一条</span>
          <span class="pager-title" th:text="${prev.title}">标题</span>
        </a>
        <a class="pager-link pager-next" th:if="${next != null}"
           th:href="${'/archive/' + archive.id + '?item=' + next.id}">
          <span class="pager-dir">下一条 →</span>
          <span class="pager-title" th:text="${next.title}">标题</span>
        </a>
      </nav>
    </article>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
