<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" data-theme="auto">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="wrap">
  <header class="page-head">
    <div>
      <h1 class="page-title" th:text="${kind.label}">学习</h1>
      <p class="sub" th:text="${kind.hint}">今天学到的东西</p>
    </div>
    <a class="btn btn-small" th:if="${user != null}"
       th:href="@{/admin/new(kind=kind.code)}">写一篇</a>
  </header>

  <p class="banner" th:if="${param.ok != null and param.ok[0] == 'saved'}">保存好了。</p>

  <p class="diary-bar" th:if="${kind.name() == 'DIARY'}">
    <span th:text="${'已解锁，' + diaryMinutes + ' 分钟后再进来要重新输密码。'}">已解锁</span>
    <form th:action="@{/diary/lock}" method="post" class="inline">
      <button type="submit" class="linklike">现在就锁上</button>
    </form>
  </p>

  <div th:replace="~{fragments/entry-list :: list(${entries}, ${kind}, ${kind.name() != 'DIARY'}, '这一栏还是空的。')}"></div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
