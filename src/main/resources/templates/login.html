<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" data-theme="auto">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>

<div class="gate-theme">
  <span th:replace="~{fragments/theme-switch :: toggle}"></span>
</div>

<div class="gate gate-hero">
  <!-- 舞台上的一切都是图片坐标：芯片热区、提示、卡片都钉在这块图上 -->
  <div class="gate-stage">
    <input type="checkbox" id="gate-open" class="gate-chip"
           th:checked="${param.error != null}" aria-label="Open the login panel" />

    <img src="/img/login-bg.jpg"
         srcset="/img/login-bg-800.jpg 800w, /img/login-bg.jpg 1589w"
         sizes="100vw" width="1589" height="1080" alt="" fetchpriority="high" />

    <span class="gate-veil" aria-hidden="true"></span>

    <p class="gate-notice" th:if="${param.logout != null}">SIGNED OUT</p>

    <section class="gate-card" th:classappend="${param.error != null} ? 'is-error'">
      <p class="gate-status">
        <span class="gate-status-dot" aria-hidden="true"></span>
        <span>SECURE ACCESS</span>
      </p>

      <h1 class="gate-title">IDENTITY CHECK</h1>
      <p class="gate-sub">Private access only.</p>

      <p class="form-error" th:if="${param.error != null}">Wrong username or password.</p>

      <form th:action="@{/login}" method="post" class="stack">
        <label class="field">
          <span>USERNAME</span>
          <input name="username" autocomplete="username" required />
        </label>
        <label class="field">
          <span>PASSWORD</span>
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="btn btn-block gate-submit" type="submit">VERIFY</button>
      </form>

      <p class="gate-foot">Everything behind this door. The diary asks again.</p>
    </section>
  </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
