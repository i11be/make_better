<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" data-theme="auto">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>
<main>
  <p class="toast" role="status"
     th:if="${param.ok != null and param.ok[0] == 'login'}">身份核验成功</p>

  <section class="tree-hero" aria-label="入口">
    <div class="tree-canvas">
      <picture>
        <source media="(max-width: 860px)" srcset="/img/tree-960.jpg" />
        <img src="/img/tree-1920.jpg"
             srcset="/img/tree-960.jpg 960w, /img/tree-1440.jpg 1440w, /img/tree-1920.jpg 1920w"
             sizes="100vw" width="1920" height="960" alt=""
             decoding="async" fetchpriority="high" />
      </picture>
      <div class="tree-veil" aria-hidden="true"></div>
    </div>
    <nav class="tree-nodes" aria-label="五个入口">
      <a class="tree-node tree-node--home" th:href="@{/profile}">
        <span class="tree-dot" aria-hidden="true"></span>
        <span class="tree-tag"><b>主页</b><i>头像 · ID</i></span>
      </a>
      <a class="tree-node tree-node--feed" th:href="@{/feed}">
        <span class="tree-dot" aria-hidden="true"></span>
        <span class="tree-tag"><b>动态</b><i th:text="${postsCount + ' 条'}">0 条</i></span>
      </a>
      <a class="tree-node tree-node--study" th:href="@{/study}">
        <span class="tree-dot" aria-hidden="true"></span>
        <span class="tree-tag"><b>学习</b><i th:text="${studyCount + ' 篇'}">0 篇</i></span>
      </a>
      <a class="tree-node tree-node--archive" th:href="@{/archive}">
        <span class="tree-dot" aria-hidden="true"></span>
        <span class="tree-tag"><b>档案</b><i th:text="${archiveCount + ' 个'}">0 个</i></span>
      </a>
      <a class="tree-node tree-node--diary" th:href="@{/diary}">
        <span class="tree-dot" aria-hidden="true"></span>
        <span class="tree-tag"><b>日记</b><i th:text="${diaryCount + ' 篇'}">0 篇</i></span>
      </a>
    </nav>
  </section>

  <div class="wrap" th:if="${param.ok != null and param.ok[0] == 'welcome'}">
    <p class="banner">
      账号建好了。点树枝上的名字进去 —— 先去
      <a th:href="@{/profile}">主页</a> 看看，或者
      <a th:href="@{/feed}">发一条动态</a>。
    </p>
  </div>
</main>
</body>
</html>
