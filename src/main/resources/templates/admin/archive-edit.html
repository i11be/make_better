<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" data-theme="auto">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="wrap">
  <header class="page-head">
    <div>
      <a class="back-link" th:href="@{/admin/archives}">← 档案管理</a>
      <h1 class="page-title" th:text="${archive.title}">档案</h1>
    </div>
    <a class="quiet" th:href="${'/archive/' + archive.id}">看前台 →</a>
  </header>

  <p class="banner" th:if="${param.ok != null and param.ok[0] == 'saved'}">存好了。</p>
  <p class="banner" th:if="${param.ok != null and param.ok[0] == 'deleted'}">删掉了。</p>

  <section class="block">
    <div class="block-head"><h2>档案名字</h2></div>
    <form th:action="${'/admin/archives/' + archive.id}" method="post" class="stack">
      <label class="field">
        <span>名字</span>
        <input name="title" th:value="${archive.title}" maxlength="120" required />
      </label>
      <button class="btn btn-small" type="submit">保存</button>
    </form>
  </section>

  <section class="block">
    <div class="block-head">
      <h2>条目</h2>
      <span class="quiet" th:text="${#lists.size(items) + ' 条'}">0 条</span>
      <a class="btn btn-small push-right" th:href="${'/admin/archives/' + archive.id + '/items/new'}">新建条目</a>
    </div>

    <p class="empty" th:if="${#lists.isEmpty(items)}">还没写条目。点右上角「新建条目」开始。</p>

    <table class="table" th:unless="${#lists.isEmpty(items)}">
      <thead><tr><th>顺序</th><th>标题</th><th>操作</th></tr></thead>
      <tbody>
      <tr th:each="i, s : ${items}">
        <td class="td-order" th:text="${s.count}">1</td>
        <td class="td-title"><a th:href="${'/admin/archives/' + archive.id + '/items/' + i.id}"
                                th:text="${i.title}">标题</a></td>
        <td class="td-actions">
          <form th:action="${'/admin/archives/' + archive.id + '/items/' + i.id + '/move'}"
                method="post" class="inline">
            <input type="hidden" name="direction" value="up" />
            <button type="submit" class="linklike" th:disabled="${s.first}">↑</button>
          </form>
          <form th:action="${'/admin/archives/' + archive.id + '/items/' + i.id + '/move'}"
                method="post" class="inline">
            <input type="hidden" name="direction" value="down" />
            <button type="submit" class="linklike" th:disabled="${s.last}">↓</button>
          </form>
          <a class="quiet" th:href="${'/admin/archives/' + archive.id + '/items/' + i.id}">改</a>
          <form th:action="${'/admin/archives/' + archive.id + '/items/' + i.id + '/delete'}"
                method="post" class="inline"
                th:attr="data-confirm=${'删掉「' + i.title + '」？不能撤回。'}">
            <button type="submit" class="linklike danger">删</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
