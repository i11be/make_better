<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" data-theme="auto">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="wrap">
  <header class="page-head">
    <div>
      <a class="back-link" th:href="@{/}">← 首页</a>
      <h1 class="page-title" th:text="${kind.label}">学习</h1>
      <p class="sub" th:text="${kind.hint}">今天学到的东西</p>
    </div>
    <a class="btn btn-small" th:if="${user != null}"
       th:href="@{/admin/new(kind=${kind.code})}">写一篇</a>
  </header>

  <p class="banner" th:if="${param.ok != null and param.ok[0] == 'saved'}">保存好了。</p>

  <nav class="filters" aria-label="按分类看">
    <a class="filter-pill" th:each="t : ${page.tabs}"
       th:href="@{/study(cat=${t.code}, sort=${page.sortCode}, tag=${page.tag})}"
       th:classappend="${t.code == page.catCode} ? 'on'"
       th:attr="aria-current=${t.code == page.catCode ? 'page' : null}">
      <span th:text="${t.label}">全部</span>
      <span class="filter-count" th:text="${t.count}">0</span>
    </a>
  </nav>

  <div class="filters">
    <span class="filter-label">排序</span>
    <a class="filter-pill" th:href="@{/study(cat=${page.catCode}, sort='time', tag=${page.tag})}"
       th:classappend="${!page.byTag} ? 'on'">按时间</a>
    <a class="filter-pill" th:href="@{/study(cat=${page.catCode}, sort='tag', tag=${page.tag})}"
       th:classappend="${page.byTag} ? 'on'">按标签</a>

    <a class="filter-tag" th:if="${not #strings.isEmpty(page.tag)}"
       th:href="@{/study(cat=${page.catCode}, sort=${page.sortCode})}"
       th:attr="title=${'去掉 #' + page.tag + ' 这个筛选'}">
      <span th:text="${'#' + page.tag}">#Java</span>
      <span aria-hidden="true">✕</span>
    </a>
  </div>

  <p class="empty" th:if="${#lists.isEmpty(page.items)}">这一栏还是空的。</p>

  <ol class="items" th:if="${!page.byTag and not #lists.isEmpty(page.items)}">
    <th:block th:each="e : ${page.items}">
      <th:block th:replace="~{fragments/entry-list :: studyItem(${e}, ${page.catCode}, true)}"></th:block>
    </th:block>
  </ol>

  <th:block th:if="${page.byTag}">
    <section class="tag-group" th:each="g : ${page.groups}">
      <h2 class="group-head">
        <span th:text="${g.label == '未打标签' ? g.label : '#' + g.label}">#Java</span>
        <span class="group-count" th:text="${#lists.size(g.items) + ' 篇'}">0 篇</span>
      </h2>
      <ol class="items">
        <th:block th:each="e : ${g.items}">
          <th:block th:replace="~{fragments/entry-list :: studyItem(${e}, ${page.catCode}, false)}"></th:block>
        </th:block>
      </ol>
    </section>
  </th:block>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
