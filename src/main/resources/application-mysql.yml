# 正式配置：MySQL 8。需要先在 MySQL 里建好库和账号（见 README「接上 MySQL」）
# 启动：mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/make_me_better?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:mmb}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 表结构只由 Flyway 管，这里不让 Hibernate 动
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
